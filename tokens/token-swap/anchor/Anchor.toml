[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
swap_example = "CuLQSeUt9v4o1Qzjt1EQH2MirC2yMqiDXYgbRoigZqMA"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm ts-mocha -p ./tsconfig.json -t 1000000 tests/swap.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = true
